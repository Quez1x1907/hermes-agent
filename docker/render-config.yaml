# Config baked into $HERMES_HOME at image build for headless PaaS deploys.
# Keys come from the platform environment (GEMINI_API_KEY, B_AI_API_KEY).
database:
  journal_mode: "wal"
model:
  default: "gemini-3-flash-preview"
  provider: "gemini"
fallback_providers:
  - provider: "custom"
    model: "glm-5.3-flash"
    base_url: "https://api.b.ai/v1"
    key_env: "B_AI_API_KEY"
  - provider: "custom"
    model: "deepseek-v4.1-flash"
    base_url: "https://api.b.ai/v1"
    key_env: "B_AI_API_KEY"
approvals:
  mode: "off"             # gateway chats: execute commands without Allow/Deny prompts
  cron_mode: "approve"    # scheduled jobs run unattended
  unattended_mode: "approve"
  single_query_mode: "approve"
memory:
  provider: "honcho"      # durable user memory via HONCHO_API_KEY (survives redeploys)
